[project]
name = "shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "conavis", email = "nivan.kairo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "uvicorn>=0.52.4",
]

[project.scripts]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]

[tool.mypy]
files = ["src"]
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
strict = true

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.django-stubs]
django_settings_module = "shortener.config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shortener.config.settings"
python_files = ["test_*.py"]
filterwarnings = ["error"]
asyncio_mode = "auto"
addopts = "--reuse-db"
