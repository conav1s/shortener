name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
          DATABASE_URL: postgres://shortener:testpassword@localhost:5432/shortener
        run: uv run mypy

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "False"
          DATABASE_URL: postgres://shortener:testpassword@localhost:5432/shortener
        run: uv run pytest

