{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL shortener</title>
    <link rel="stylesheet" href="{% static 'links/style.css' %}">
</head>
<body>
    <div class="card">
        <h1>URL's link shortener</h1>
        <p class="subtitle">Insert an original URL</p>

        <form method="post">
            {% csrf_token %}
            <input type="url" name="original_url" placeholder="https://example.com" required>
            <button type="submit">Short it!</button>
        </form>

        {% if short_url %}
        <div class="result visible">
            <a id="result-link" href="{{ short_url }}" target="_blank">{{ short_url }}</a>
            <button class="copy-btn" id="copy-btn">Copy link</button>
        </div>
        {% endif %}

        {% if error %}
        <div class="error-msg visible">{{ error }}</div>
        {% endif %}
    </div>

    <script src="{% static 'links/app.js' %}"></script>
</body>
</html>
